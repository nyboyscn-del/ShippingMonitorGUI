name: upload-release-asset (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: upload-release-asset

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified asset from Drive
        run: |
          pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=1Fc7lg2FQdCJHKP8zZLFuc0cLZ3HopUTZ" -O ShippingMonitorGUI_v1.0.0.zip
          ls -l ShippingMonitorGUI_v1.0.0.zip
          test "$(stat -c%s ShippingMonitorGUI_v1.0.0.zip)" = "142943811"
          echo "524f41e4b75a9c408ea971d62ab75bc557b9aa258aabc257c3196cd4a7cd54ba  ShippingMonitorGUI_v1.0.0.zip" | sha256sum -c -
      - name: Upload to release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 ShippingMonitorGUI_v1.0.0.zip --repo nyboyscn-del/ShippingMonitorGUI
          gh release view v1.0.0 --repo nyboyscn-del/ShippingMonitorGUI --json assets --jq '.assets[] | {name, size, state}'
