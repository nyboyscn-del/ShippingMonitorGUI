name: upload-release-asset-v101 (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: upload-release-asset-v101

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified asset from Drive
        run: |
          pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=1I-xcAJUZwj27h95tgMMLm-vcKr-uxZ74" -O ShippingMonitorGUI_v1.0.1.zip
          ls -l ShippingMonitorGUI_v1.0.1.zip
          test "$(stat -c%s ShippingMonitorGUI_v1.0.1.zip)" = "143018478"
          echo "e8890fe39bbe4ccbc812d9d50e89697ecce6439a2f813b2f4915d15ced9b7f40  ShippingMonitorGUI_v1.0.1.zip" | sha256sum -c -
      - name: Upload to release v1.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.1 ShippingMonitorGUI_v1.0.1.zip --repo nyboyscn-del/ShippingMonitorGUI
          gh release view v1.0.1 --repo nyboyscn-del/ShippingMonitorGUI --json assets --jq '.assets[] | {name, size, state}'
